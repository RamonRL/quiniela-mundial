  Uso:

    2. Selecciona toda la firma con el ratón (no Cmd/Ctrl+A — eso
       seleccionaría también el fondo gris).
    3. Copia (Cmd/Ctrl + C).
    4. Gmail → ⚙️ → Ver toda la configuración → General → Firma →
       Crear nueva → pega (Cmd/Ctrl + V) en el editor.
    5. Selecciona la firma como predeterminada para correos nuevos y
       respuestas. Guarda los cambios.
